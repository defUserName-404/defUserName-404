name: Profile stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-isocalendar.svg
          committer_branch: output
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Keep only the 3D graph
        run: |
          git clone --branch output --single-branch --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cd out
          perl -0ne 'print $1 if /(<svg version="1\.1".*?<\/svg>)/s' github-isocalendar.svg \
            | sed 's/ style="margin-top: -130px;"/ width="480" height="270"/' > graph.svg
          test -s graph.svg
          mv graph.svg github-isocalendar.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-isocalendar.svg
          git diff --cached --quiet || git commit -m "chore: trim isocalendar to the 3D graph"
          git push

      - name: Languages card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          .github/scripts/languages-card.sh defUserName-404 github-languages.svg
          git clone --branch output --single-branch --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out-lang
          cp github-languages.svg out-lang/
          cd out-lang
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          git diff --cached --quiet || git commit -m "chore: update languages card"
          git push

      - name: Pull request and issue follow-up
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-followup.svg
          committer_branch: output
          plugin_followup: yes
          plugin_followup_sections: user, repositories

      - name: Pinned repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-pinned.svg
          committer_branch: output
          plugin_repositories: yes
          plugin_repositories_pinned: 6

      - name: Stars and topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-stars.svg
          committer_branch: output
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 12
