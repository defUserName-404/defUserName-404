name: Profile stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Isometric contribution skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-skyline.svg
          committer_branch: output
          plugin_isometric: yes
          plugin_isometric_duration: full-year

      - name: Habits and achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: defUserName-404
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          filename: github-habits.svg
          committer_branch: output
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

  snake:
    needs: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-light.svg

      - name: Publish to output branch
        run: |
          git clone --branch output --single-branch --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out
          cp dist/github-snake.svg dist/github-snake-light.svg out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-light.svg
          git diff --cached --quiet || git commit -m "chore: update snake"
          git push
